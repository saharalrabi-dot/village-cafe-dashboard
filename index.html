<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b1d8f">
<title>أداء مقهى القرية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --sky1:#3b1d8f; --sky2:#6a2fd6; --sky3:#1aa7d6;
  --card:#ffffff; --soft:#f3efff; --line:#e3dcf5;
  --ink:#1b1238; --ink2:#463d63; --muted:#7a7194; --edge:#1b1238;
  --purple:#7D2AE8; --teal:#00A3AA; --orange:#E8701F; --yellow:#FFC93C; --green:#2fbf5b; --red:#e5484d;
  --good:#1f8a4c; --good-soft:#dff7e7; --warn:#a35f00; --warn-soft:#fff1cc; --bad:#c23b3b; --bad-soft:#ffe1e1;
  --display:"Baloo Bhaijaan 2",Tajawal,"Segoe UI",Tahoma,sans-serif;
  --body:Tajawal,"Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--sky1)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.65;min-height:100vh;
  background:
    linear-gradient(rgba(255,255,255,.06) 2px,transparent 2px) 0 0/48px 48px,
    linear-gradient(90deg,rgba(255,255,255,.06) 2px,transparent 2px) 0 0/48px 48px,
    linear-gradient(170deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 130%) fixed;
  padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:1120px;margin:0 auto;padding:12px 14px 48px}
/* chunky game panel: thick dark edge + solid bottom "3D" shadow */
.panel,.summary,.kpi,.chart-card,.todo,.glossary div,.empty{background:var(--card);border:3px solid var(--edge);border-radius:18px;box-shadow:0 5px 0 var(--edge)}
/* top bar like a game HUD */
header{position:sticky;top:0;z-index:5;margin:0 -14px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:linear-gradient(180deg,rgba(59,29,143,.97),rgba(59,29,143,.88));backdrop-filter:blur(6px);
  display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;border-bottom:3px solid var(--edge)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{flex:none;width:46px;height:46px;border-radius:12px;background:var(--yellow);border:3px solid var(--edge);box-shadow:0 3px 0 var(--edge);display:grid;place-items:center;font-size:24px;transform:rotate(-6deg)}
.eyebrow{font-family:var(--display);font-weight:700;color:var(--yellow);font-size:14px;line-height:1.2}
h1{margin:0;font-family:var(--display);font-size:clamp(19px,4.6vw,30px);font-weight:800;line-height:1.25;color:#fff;text-shadow:0 2px 0 var(--edge)}
.meta{color:#e9e2ff;font-size:14px;line-height:1.5}
.meta.dark,.chart-card .meta,.kpi .meta,.empty .meta,.summary .meta{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-weight:800;font-size:13px;border:2px solid var(--edge);font-family:var(--body)}
.pill.good{color:#0d5a2d;background:#9cf0b6} .pill.warn{color:#6b3c00;background:var(--yellow)} .pill.bad{color:#fff;background:var(--red)}
.controls{display:flex;gap:6px}
.controls button{font-family:var(--display);font-size:15px;font-weight:800;padding:6px 14px 4px;border-radius:12px;border:3px solid var(--edge);background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--edge);min-height:40px;transition:transform .08s}
.controls button:active{transform:translateY(3px);box-shadow:none}
.controls button[aria-pressed="true"]{background:var(--green);color:#fff;text-shadow:0 1px 0 var(--edge)}
h2{font-family:var(--display);font-size:24px;font-weight:800;margin:28px 0 12px;color:#fff;text-shadow:0 2px 0 var(--edge);line-height:1.3}
h2 small{display:block;font-family:var(--body);font-size:14.5px;font-weight:700;color:#e9e2ff;text-shadow:none}
.summary{padding:16px 18px;margin-top:18px;background:linear-gradient(180deg,#fff,#fbf8ff)}
.summary h2{margin:0 0 6px;font-size:22px;color:var(--ink);text-shadow:none}
.summary ul{margin:0;padding:0;list-style:none}
.summary li{margin:8px 0;font-size:17px;padding-inline-start:30px;position:relative}
.summary li::before{content:"⭐";position:absolute;inset-inline-start:0;top:0}
.summary b{color:var(--purple)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:7px;background:var(--accent,var(--purple))}
.kpi .label{font-family:var(--display);font-weight:800;color:var(--ink);font-size:16.5px;display:flex;align-items:center;gap:8px;line-height:1.3;margin-top:4px}
.kpi .icon{flex:none;width:38px;height:38px;border-radius:10px;border:2.5px solid var(--edge);background:var(--accent,var(--purple));display:grid;place-items:center;font-size:19px;box-shadow:0 2px 0 var(--edge)}
.kpi .value{font-family:var(--display);font-size:38px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi .value small{font-family:var(--body);font-size:16px;font-weight:800;color:var(--ink2)}
.kpi .trend{font-size:14.5px;color:var(--ink2);font-weight:700}
.kpi .trend b.up{color:var(--good)} .kpi .trend b.down{color:var(--bad)}
.xp{height:16px;border:2.5px solid var(--edge);border-radius:999px;background:#ece6fb;overflow:hidden;position:relative}
.xp i{display:block;height:100%;background:linear-gradient(180deg,#ffe38a,var(--yellow));border-inline-end:2.5px solid var(--edge);min-width:6px}
.xp i.done{background:linear-gradient(180deg,#9cf0b6,var(--green))}
.goal{font-size:13.5px;color:var(--muted);font-weight:700}
.kpi details{border-top:2px dashed var(--line);padding-top:6px;margin-top:auto}
.kpi summary{cursor:pointer;font-weight:800;color:var(--purple);font-size:14.5px;list-style:none;min-height:30px;display:flex;align-items:center}
.kpi summary::-webkit-details-marker{display:none}
.kpi summary::before{content:"❓";margin-inline-end:6px}
.kpi .why{font-size:15px;color:var(--ink2);margin:4px 0 0}
.chart-card{padding:14px 14px 8px;margin-bottom:16px;min-width:0}
.chart-card h3{margin:0;font-family:var(--display);font-size:20px;font-weight:800;line-height:1.3}
.chart-card p.desc{margin:2px 0 8px;color:var(--ink2);font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:6px;border-radius:3px;display:inline-block;border:1.5px solid var(--edge)}
.legend i.band{height:12px;background:rgba(0,163,170,.18);border:1.5px dashed var(--teal)}
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible;direction:ltr} /* coordinates are laid out by hand, so anchors are left-to-right */
.chart .tip{position:absolute;pointer-events:none;background:#fff;border:2.5px solid var(--edge);border-radius:12px;padding:6px 10px;font-size:14px;box-shadow:0 3px 0 var(--edge);white-space:nowrap;display:none;z-index:2;font-weight:700}
.chart .tip b{display:block;font-size:13px;color:var(--ink2)}
.tscroll{overflow-x:auto;max-width:100%}
.tscroll td:first-child{white-space:normal}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
details.table{margin:4px 0 6px;font-size:14.5px}
details.table summary{cursor:pointer;color:var(--purple);font-weight:800;min-height:34px;display:flex;align-items:center}
details.table .scroll{overflow-x:auto;max-height:280px;overflow-y:auto;border:2px solid var(--edge);border-radius:10px;margin-top:6px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1.5px solid var(--line);text-align:start;white-space:nowrap}
th{background:var(--soft);position:sticky;top:0;font-family:var(--display)}
.bars .row{display:grid;grid-template-columns:minmax(96px,170px) 1fr auto;gap:8px;align-items:center;margin:10px 0;font-size:15px;font-weight:700}
.bars .track{height:22px;background:#ece6fb;border:2.5px solid var(--edge);border-radius:8px;overflow:hidden}
.bars .fill{height:100%;background:linear-gradient(180deg,#a978ff,var(--purple));border-inline-end:2.5px solid var(--edge);min-width:4px}
.bars .num{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.bars .num .meta{color:var(--muted);font-family:var(--body)}
.todo{padding:14px 18px;background:linear-gradient(180deg,#fff7e0,#fff)}
.todo ol{margin:0;padding:0;list-style:none;counter-reset:q}
.todo li{margin:12px 0;font-size:16.5px;padding-inline-start:44px;position:relative;counter-increment:q}
.todo li::before{content:counter(q);position:absolute;inset-inline-start:0;top:0;width:32px;height:32px;border-radius:9px;background:var(--orange);color:#fff;border:2.5px solid var(--edge);box-shadow:0 2px 0 var(--edge);display:grid;place-items:center;font-family:var(--display);font-weight:800}
.glossary{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.glossary div{padding:12px 14px;font-size:15px}
.glossary b{display:block;font-family:var(--display);font-size:17px}
.empty{padding:20px;margin-top:20px}
.empty h2{color:var(--ink);text-shadow:none}
.empty ol li{margin:8px 0}
.err{color:#fff;font-size:14px;font-weight:700}
footer{margin-top:34px;color:#e9e2ff;font-size:13.5px;border-top:2px solid rgba(255,255,255,.25);padding-top:12px}
@media (max-width:600px){
  header{position:relative;gap:8px;padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:10px}
  .logo{width:38px;height:38px;font-size:20px}
  .eyebrow{display:none}
  .controls button{min-height:38px;padding:4px 8px 2px}
  .controls{width:100%}
  .controls button{flex:1}
  h2{font-size:21px;margin-top:24px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:12px 12px 10px}
  .kpi .label{font-size:14.5px}
  .kpi .icon{width:32px;height:32px;font-size:16px}
  .kpi .value{font-size:28px}
  .kpi .value small{font-size:13px}
  .kpi .trend,.goal{font-size:12.5px}
  .bars .row{grid-template-columns:1fr auto;gap:2px 8px}
  .bars .row .track{grid-column:1 / -1;grid-row:2}
  .summary li{font-size:16px}
}
@media (prefers-reduced-motion:reduce){.controls button{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">☕</div>
      <div style="min-width:0">
        <div class="eyebrow">لوحة الأداء · روبلكس</div>
        <h1>البقاء على قيد الحياة في مقهى القرية</h1>
        <div class="meta" id="meta">جارٍ تحميل البيانات…</div>
      </div>
    </div>
    <div class="controls" role="group" aria-label="الفترة المعروضة">
      <button data-days="7">7 أيام</button>
      <button data-days="28" aria-pressed="true">28 يومًا</button>
      <button data-days="90">90 يومًا</button>
    </div>
  </header>

  <div id="app"></div>

  <footer>
    البيانات من تحليلات روبلكس الرسمية (Open Cloud Analytics)، وتُحدَّث تلقائيًا كل يوم الساعة 6 صباحًا بتوقيت الرياض.
    أرقام أمس قد تتغير قليلًا خلال 48 ساعة. المعدلات المرجعية تقريبية ومأخوذة من لوحة روبلكس نفسها.
  </footer>
</div>

<script>
// ------------------------------------------------------------------ settings
const BENCH = { // approximate ranges shown in the Roblox Creator Dashboard
  d1: [6, 12], d7: [0.5, 2], playtime: [13, 28], session: [8, 20],
};
const GOAL = { d1: 8, playtime: 12 };
const C = { purple: "#7D2AE8", teal: "#00A3AA", orange: "#E8701F", ink2: "#4b4560", line: "#e7e3f0", muted: "#7a7490" };

const fmt = (v, d = 0) => v == null || !isFinite(v) ? "—" : Number(v).toLocaleString("ar-SA-u-nu-latn", { maximumFractionDigits: d, minimumFractionDigits: d });
const pct = (v, d = 1) => v == null ? "—" : fmt(v, d) + "%";
const dayName = (t) => new Date(t + "T00:00:00Z").toLocaleDateString("ar-SA-u-nu-latn-ca-gregory", { day: "numeric", month: "short", timeZone: "UTC" });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let DATA = null, EVENTS = [], DAYS = 28;

// retention values may come as a fraction (0.02) or a percent (2) — show percent
function asPercent(points) {
  if (!points || !points.length) return [];
  const max = Math.max(...points.map((p) => p.v));
  return max <= 1 ? points.map((p) => ({ t: p.t, v: p.v * 100 })) : points;
}
function lastDays(points, n) {
  if (!points || !points.length) return [];
  const end = new Date(points[points.length - 1].t + "T00:00:00Z");
  const start = new Date(end); start.setUTCDate(start.getUTCDate() - (n - 1));
  const s = start.toISOString().slice(0, 10);
  return points.filter((p) => p.t >= s);
}
const avg = (pts) => pts.length ? pts.reduce((a, p) => a + p.v, 0) / pts.length : null;
// a rate averaged over days, weighted by that day's new players (as Roblox does): a day with
// 1 new player must not count as much as a day with 150
function wavg(pts, weights) {
  if (!pts.length) return null;
  const w = new Map((weights || []).map((p) => [p.t, p.v]));
  let num = 0, den = 0;
  for (const p of pts) { const k = w.get(p.t); if (k > 0) { num += p.v * k; den += k; } }
  return den > 0 ? num / den : avg(pts);
}
const sum = (pts) => pts.length ? pts.reduce((a, p) => a + p.v, 0) : null;
function windows(points, n) { // this period vs the period before it
  if (!points || !points.length) return [[], []];
  const cur = lastDays(points, n);
  const first = cur.length ? cur[0].t : null;
  const before = points.filter((p) => p.t < first).slice(-n);
  return [cur, before];
}
function status(v, [lo, hi]) {
  if (v == null) return null;
  if (v >= lo) return v > hi ? { k: "good", t: "✅ ممتاز" } : { k: "good", t: "✅ ضمن المعدل" };
  if (v >= lo * 0.6) return { k: "warn", t: "⚠️ قريب من المعدل" };
  return { k: "bad", t: "🔻 أقل من المعدل" };
}

// ------------------------------------------------------------------ source names
function sourceName(raw) {
  const s = String(raw).toLowerCase();
  if (s.includes("sponsor") || s.includes("ads") || s.includes("advert")) return "📣 الإعلانات المدفوعة";
  if (s.includes("home")) return "🏠 الصفحة الرئيسية في روبلكس";
  if (s.includes("continue")) return "▶️ متابعة اللعب (عائدون)";
  if (s.includes("friend")) return "👭 الأصدقاء";
  if (s.includes("search")) return "🔎 البحث";
  if (s.includes("chart") || s.includes("sort")) return "📊 قوائم الألعاب";
  if (s.includes("teleport")) return "🌀 انتقال من لعبة أخرى";
  if (s.includes("feature")) return "⭐ مختارة من روبلكس";
  if (s.includes("portal")) return "🚪 إعلانات البوابات";
  if (s.includes("total")) return "المجموع";
  if (s.includes("other") || s.includes("unknown")) return "مصادر أخرى";
  return raw;
}

// ------------------------------------------------------------------ line chart (SVG + hover)
function lineChart(el, series, opt = {}) {
  const W = Math.max(280, el.clientWidth || 600), H = opt.height || (W < 520 ? 200 : 240);
  const m = { t: 12, r: 12, b: 30, l: 44 };
  const all = series.flatMap((s) => s.points);
  if (!all.length) { el.innerHTML = '<p class="meta">لا توجد بيانات لهذه الفترة بعد.</p>'; return; }
  const dates = [...new Set(all.map((p) => p.t))].sort();
  let ymax = Math.max(...all.map((p) => p.v), opt.band ? opt.band[1] : 0, opt.goal || 0);
  ymax = ymax <= 0 ? 1 : niceMax(ymax / 4) * 4; // four even steps
  const x = (t) => {
    const i = dates.indexOf(t);
    return dates.length === 1 ? m.l + (W - m.l - m.r) / 2 : W - m.r - (i / (dates.length - 1)) * (W - m.l - m.r); // RTL: newest at the left
  };
  const y = (v) => m.t + (1 - v / ymax) * (H - m.t - m.b);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || "")}">`;
  // grid + y labels (recessive)
  for (let k = 0; k <= 4; k++) {
    const v = (ymax / 4) * k, yy = y(v);
    svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}" stroke="${C.line}" stroke-width="1"/>`;
    svg += `<text x="${m.l - 8}" y="${yy + 4}" font-size="12" fill="${C.muted}" text-anchor="end">${fmt(v, ymax < 5 ? 1 : 0)}${opt.unit === "%" ? "%" : ""}</text>`;
  }
  if (opt.band) {
    const y1 = y(Math.min(opt.band[1], ymax)), y0 = y(opt.band[0]);
    svg += `<rect x="${m.l}" y="${y1}" width="${W - m.l - m.r}" height="${Math.max(0, y0 - y1)}" fill="rgba(0,163,170,.10)" stroke="${C.teal}" stroke-dasharray="4 4" stroke-width="1"/>`;
  }
  if (opt.goal) {
    svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(opt.goal)}" y2="${y(opt.goal)}" stroke="${C.orange}" stroke-width="2" stroke-dasharray="6 5"/>`;
    // Arabic label: right-to-left run, anchored to the chart's right edge
    svg += `<text x="${W - m.r - 4}" y="${y(opt.goal) - 6}" font-size="12.5" font-weight="800" fill="${C.ink2}" direction="rtl" text-anchor="start">الهدف ${fmt(opt.goal)}${opt.unit === "%" ? "٪" : " دقيقة"}</text>`;
  }
  // events (ad campaigns, updates)
  for (const e of EVENTS) {
    if (!dates.includes(e.date)) continue;
    const xx = x(e.date);
    svg += `<line x1="${xx}" x2="${xx}" y1="${m.t}" y2="${H - m.b}" stroke="${C.muted}" stroke-dasharray="2 4"/><text x="${xx}" y="${m.t + 10}" font-size="15" text-anchor="middle">📣</text>`;
  }
  // x labels (a few)
  const step = Math.max(1, Math.ceil(dates.length / (W < 520 ? 4 : 6)));
  dates.forEach((t, i) => {
    const last = i === dates.length - 1;
    // edge labels hug the chart edge so they never stick out on a phone (RTL: oldest at the right)
    const anchor = dates.length > 1 && i === 0 ? "end" : last && dates.length > 1 ? "start" : "middle";
    if ((i % step === 0 && (last || dates.length - 1 - i >= step)) || last) svg += `<text x="${x(t)}" y="${H - 8}" font-size="12" fill="${C.muted}" text-anchor="${anchor}" direction="ltr" unicode-bidi="plaintext">${dayName(t)}</text>`;
  });
  // lines
  for (const s of series) {
    if (!s.points.length) continue;
    const d = s.points.map((p, i) => `${i ? "L" : "M"}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
    svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (s.points.length < 40) for (const p of s.points) svg += `<circle cx="${x(p.t)}" cy="${y(p.v)}" r="3.6" fill="${s.color}" stroke="#1b1238" stroke-width="1.5"/>`;
  }
  svg += `<line class="cross" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="${C.ink2}" stroke-width="1" visibility="hidden"/>`;
  svg += `<rect class="hit" x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
  el.innerHTML = svg;
  const svgEl = el.querySelector("svg"), tip = el.querySelector(".tip"), cross = el.querySelector(".cross");
  const move = (ev) => {
    const r = svgEl.getBoundingClientRect();
    const px = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left) * (W / r.width);
    let best = dates[0], bd = 1e9;
    for (const t of dates) { const dd = Math.abs(x(t) - px); if (dd < bd) { bd = dd; best = t; } }
    cross.setAttribute("x1", x(best)); cross.setAttribute("x2", x(best)); cross.setAttribute("visibility", "visible");
    const ev2 = EVENTS.find((e) => e.date === best);
    tip.innerHTML = `<b>${dayName(best)}</b>` + series.map((s) => {
      const p = s.points.find((q) => q.t === best);
      return `<div><span style="color:${s.color}">●</span> ${esc(s.name)}: <strong>${p ? fmt(p.v, opt.digits ?? 0) + (opt.unit || "") : "—"}</strong></div>`;
    }).join("") + (ev2 ? `<div>📣 ${esc(ev2.label)}</div>` : "");
    tip.style.display = "block";
    const left = (x(best) / W) * r.width;
    tip.style.left = Math.min(Math.max(0, left - tip.offsetWidth / 2), r.width - tip.offsetWidth) + "px";
    tip.style.top = "4px";
  };
  const hide = () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); };
  el.querySelector(".hit").addEventListener("mousemove", move);
  el.querySelector(".hit").addEventListener("touchstart", move, { passive: true });
  el.querySelector(".hit").addEventListener("touchmove", move, { passive: true });
  el.addEventListener("mouseleave", hide);
}
function niceMax(v) {
  const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
function tableOf(series, unit = "", digits = 0) {
  const dates = [...new Set(series.flatMap((s) => s.points.map((p) => p.t)))].sort().reverse();
  return `<details class="table"><summary>عرض الأرقام كجدول</summary><div class="scroll"><table><thead><tr><th>اليوم</th>${series.map((s) => `<th>${esc(s.name)}</th>`).join("")}</tr></thead><tbody>${dates.map((t) => `<tr><td>${dayName(t)}</td>${series.map((s) => { const p = s.points.find((q) => q.t === t); return `<td>${p ? fmt(p.v, digits) + unit : "—"}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div></details>`;
}
function legend(items) {
  return `<div class="legend">${items.map((i) => i.band ? `<span><i class="band"></i>${esc(i.name)}</span>` : `<span><i style="background:${i.color}"></i>${esc(i.name)}</span>`).join("")}</div>`;
}

}
function trendWord(cur, prev) {
  if (cur == null || !prev) return "";
  const ch = ((cur - prev) / prev) * 100;
  if (Math.abs(ch) < 3) return "بلا تغيير يُذكر";
  return ch > 0 ? `بزيادة ${fmt(ch)}%` : `بانخفاض ${fmt(Math.abs(ch))}%`;
}
function trendLine(cur, prev, isPct) {
  if (cur == null || prev == null || prev === 0) return "";
  const ch = isPct ? cur - prev : ((cur - prev) / Math.abs(prev)) * 100;
  if (Math.abs(ch) < (isPct ? 0.2 : 3)) return "➖ بلا تغيير يُذكر عن الفترة السابقة";
  const txt = isPct ? `${fmt(Math.abs(ch), 1)} نقطة` : `${fmt(Math.abs(ch))}%`;
  return ch > 0 ? `<b class="up">▲ ${txt}</b> عن الفترة السابقة` : `<b class="down">▼ ${txt}</b> عن الفترة السابقة`;
}

function renderEmpty(reason) {
  document.getElementById("meta").textContent = "لم تصل البيانات بعد";
  document.getElementById("app").innerHTML = `<div class="empty"><h2 style="margin-top:0">الصفحة جاهزة، وتنتظر أول تحديث للبيانات</h2>
  <p>${esc(reason)}</p>

    <li>أنشئي مفتاح Open Cloud من <b>create.roblox.com ← Open Cloud ← API Keys</b>، وأضيفي اللعبة مع صلاحية <b>universe.analytics:read</b>.</li>
    <li>في هذا المستودع على GitHub: <b>Settings ← Secrets and variables ← Actions ← New repository secret</b>، بالاسم <b>ROBLOX_API_KEY</b> والقيمة المفتاح.</li>
    <li>من تبويب <b>Actions</b> اختاري «Update game analytics» ثم <b>Run workflow</b>. بعد دقيقتين تقريبًا تظهر الأرقام هنا.</li>
  </ol></div>`;
}

async function load() {
  try { EVENTS = await (await fetch("data/events.json", { cache: "no-store" })).json(); } catch { EVENTS = []; }
  try {
    const res = await fetch("data/analytics.json", { cache: "no-store" });
    if (!res.ok) throw new Error("لم يُنشأ ملف البيانات بعد.");
    DATA = await res.json();
  } catch (e) { renderEmpty(e.message || "لم يُنشأ ملف البيانات بعد."); return; }
  const when = new Date(DATA.updatedAt);
  const hours = (Date.now() - when) / 36e5;
  const health = hours < 30 ? '<span class="pill good">● محدّثة</span>' : hours < 72 ? '<span class="pill warn">● متأخرة</span>' : '<span class="pill bad">● لم تُحدَّث منذ أيام</span>';
  document.getElementById("meta").innerHTML = `آخر تحديث: ${when.toLocaleString("ar-SA-u-nu-latn-ca-gregory", { dateStyle: "long", timeStyle: "short", timeZone: "Asia/Riyadh" })} &nbsp; ${health}`;
  render();
}
document.querySelectorAll(".controls button").forEach((b) => b.addEventListener("click", () => {
  DAYS = Number(b.dataset.days);
  document.querySelectorAll(".controls button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  if (DATA) render();
}));
let rT; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => DATA && render(), 200); });
load();
